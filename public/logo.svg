<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#grad)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- AST monogram -->
  <text x="32" y="43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="bold" font-size="27" fill="#ffffff" letter-spacing="-0.5">AST</text>
</svg>