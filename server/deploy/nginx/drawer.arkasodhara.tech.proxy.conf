# Drawer cutover: arka is the temporary edge until DNS moves to my-new-server.
# Proxies the full host to the new platform stack, preserving path, host and TLS.
server {
    server_name drawer.arkasodhara.tech;
    client_max_body_size 300m;

    location / {
        proxy_pass https://152.70.64.191;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name drawer.arkasodhara.tech;
        # Both ends are controlled; the upstream certificate is valid for this host.
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/drawer.arkasodhara.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drawer.arkasodhara.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = drawer.arkasodhara.tech) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name drawer.arkasodhara.tech;
    return 404;
}
