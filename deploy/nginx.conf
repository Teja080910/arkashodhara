# =====================================================================
# Arkasodhara — dedicated Nginx site config
# =====================================================================
# Isolated server block for arkasodhara.tech ONLY. It does not touch or
# override any other site on the VPS (Agrinp, kavi-solutions, etc.).
# Replace arkasodhara.tech below with your real domain if it differs.
#
# INSTALL (once, on the VPS):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/arkasodhara.tech
#   sudo ln -s /etc/nginx/sites-available/arkasodhara.tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d arkasodhara.tech -d www.arkasodhara.tech
#
# The Next.js app runs under PM2 on port 3117 (see ecosystem.config.js).
# Keep this port in sync with deploy/deploy.sh and ecosystem.config.js.
# =====================================================================

server {
    listen 80;
    server_name arkasodhara.tech www.arkasodhara.tech;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name arkasodhara.tech www.arkasodhara.tech;

    # --- SSL certificates (installed by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/arkasodhara.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkasodhara.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --- Compression ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Serve the Next.js app via PM2 on port 3117 ---
    location / {
        proxy_pass http://127.0.0.1:3117;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- Cache immutable Next.js build assets aggressively ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3117;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
