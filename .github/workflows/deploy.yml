name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 161.97.169.66 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync sources
        run: |
          ssh root@161.97.169.66 "mkdir -p /var/www/arkasodhara"
          rsync -az --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude .next \
            --exclude '*.log' \
            --exclude '.env*' \
            ./ root@161.97.169.66:/var/www/arkasodhara/

      - name: Build & reload
        run: ssh root@161.97.169.66 "cd /var/www/arkasodhara && bash deploy/deploy.sh --no-pull"
