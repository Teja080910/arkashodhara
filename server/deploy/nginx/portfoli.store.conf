server {
    listen 80;
    listen [::]:80;
    server_name portfoli.store www.portfoli.store;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portfoli.store www.portfoli.store;

    client_max_body_size 25m;

    ssl_certificate /etc/nginx/ssl/portfoli.store/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/portfoli.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # portfoli.store stays a public alias. Authenticated/editing routes use
    # the canonical .arkasodhara.tech domain so the SSO cookie is first-party.
    location ~ ^/(sign-in|auth|reset-password|components|teams)(/|$) {
        return 302 https://folio.arkasodhara.tech$request_uri;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4104/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:4104/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
