server {
    listen 80;
    server_name folio.arkasodhara.tech portfoli.store www.portfoli.store;

    # portfoli.store is a public alias. Auth/session pages live on the
    # .arkasodhara.tech parent domain, so send those paths to the canonical app.
    if ($host ~* ^(www\.)?portfoli\.store$) {
        rewrite ^/(dashboard|login|auth|onboarding)(/.*)?$ https://folio.arkasodhara.tech$request_uri permanent;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4104/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }
    location /health {
        proxy_pass http://127.0.0.1:4104/health;
    }
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name pt.arkasodhara.tech;
    location /api/ {
        proxy_pass http://127.0.0.1:4105/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
    }
    location /ws {
        proxy_pass http://127.0.0.1:4105/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /health {
        proxy_pass http://127.0.0.1:4105/health;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

